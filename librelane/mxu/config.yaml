meta:
  version: 3
  flow: Classic

DESIGN_NAME: mxu

USE_SLANG: true

VERILOG_FILES:
  - dir::../../src/common/shift.sv
  - dir::../../src/common/counter.sv
  - dir::../../src/tri_shift.sv
  - dir::../../src/sysray/pe.sv
  - dir::../../src/sysray/sysray_nxn.sv
  - dir::../../src/sysray/mxu.sv

# Power / ground nets
VDD_NETS:
  - VDD
GND_NETS:
  - VSS

# Clock - match top-level chip (25 MHz)
CLOCK_PORT: clk_i
CLOCK_PERIOD: 40

# Let the tool auto-size the floorplan based on cell area.
# Increase FP_CORE_UTIL if placement fails due to overflow.
FP_SIZING: relative
FP_CORE_UTIL: 40

# Target placement density (%)
PL_TARGET_DENSITY_PCT: 40

# Fix hold violations
PL_RESIZER_HOLD_SLACK_MARGIN: 0.35
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.3

GRT_ALLOW_CONGESTION: true

ERROR_ON_MAGIC_DRC: False

ERROR_ON_SYNTH_CHECKS: False

