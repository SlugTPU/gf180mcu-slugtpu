meta:
  version: 3
  flow: Chip
  substituting_steps:

    # Render the layout after sealring insertion
    KLayout.Render: null
    +KLayout.SealRing: KLayout.Render

    # Disable KLayout DRC
    #KLayout.DRC: null
    #Checker.KLayoutDRC: null

    # Disable KLayout antenna check
    #KLayout.Antenna: null
    #Checker.KLayoutAntenna: null

    # Disable KLayout density check
    #KLayout.Density: null
    #Checker.KLayoutDensity: null

    # Save time during development
    # Enable for sign-off
    #OpenROAD.IRDropReport: null
    #Magic.DRC: null
    #Checker.MagicDRC: null
    #KLayout.XOR: null
    #Netgen.LVS: null
    #Checker.LVS: null

DESIGN_NAME: chip_top
VERILOG_FILES:
- dir::../src/chip_top.sv
- dir::../src/chip_core.sv
- dir::../src/tpu_soc.sv
- dir::../src/debug_mux.sv
- dir::../src/spi/spi_slave.sv
- dir::../src/spi/spibone_wb.sv
- dir::../src/spi/wb_decoder.sv
- dir::../src/spi/wb_test_ram.sv
- dir::../src/spi/wb_demux_1to2.sv
- dir::../src/spi/tpu_regs.sv
- dir::../src/dram/wb_dma_master.sv
- dir::../src/dram/wb_mux_2to1.sv
- dir::../src/dram/wb_sdr_mt48lc16m16a2_7e.sv
- dir::../src/control/control_top.sv
- dir::../src/control/control_buffer.sv
- dir::../src/control/control_sram.sv
- dir::../src/control/control_decoder.sv
- dir::../src/compute_core.sv
- dir::../src/sram/sram_1x1024.sv
- dir::../src/sram/sram_8x1024.sv
- dir::../src/sram/sram_8x1024_full.sv
- dir::../src/sram/memory_transaction.sv
- dir::../src/scalar_units/scalar_stage_sram.sv
- dir::../src/scalar_units/scalar_stage.sv
- dir::../src/scalar_units/scalar_pipe.sv
- dir::../src/scalar_units/add_n.sv
- dir::../src/scalar_units/relu_n.sv
- dir::../src/scalar_units/scale_n.sv
- dir::../src/scalar_units/quantizer_mul.sv
- dir::../src/scalar_units/load_data.sv
- dir::../src/sysray/mxu.sv
- dir::../src/sysray/pe.sv
- dir::../src/sysray/sysray_nxn.sv
- dir::../src/common/counter.sv
- dir::../src/common/elastic.sv
- dir::../src/common/fifo.sv
- dir::../src/common/shift.sv
- dir::../src/tri_shift.sv

# Enable plugin for better SystemVerilog support
USE_SLANG: True
SLANG_ARGUMENTS: ['--keep-hierarchy']

# Slightly smaller file sizes
PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# SDC files
PNR_SDC_FILE: dir::chip_top.sdc
SIGNOFF_SDC_FILE: dir::chip_top.sdc
FALLBACK_SDC: dir::chip_top.sdc

# Power / ground nets
VDD_NETS:
- VDD
GND_NETS:
- VSS

# We need to add gf180mcu_fd_io__bi_24t
# due to the unused Y output for output only pads
IGNORE_DISCONNECTED_MODULES:
- gf180mcu_fd_io__bi_24t
- gf180mcu_ws_ip__qrcode_id
- gf180mcu_ws_ip__shuttle_id
- gf180mcu_ws_ip__project_id
- gf180mcu_ws_ip__logo
- gf180mcu_ws_ip__marker

# Skip every fill / tap / decap cell from the 3.3V SCL and IO libraries
# during LVS. The 3.3V flow inserts hundreds of thousands of fillcap_16
# / tap_2 cells; netgen's partition refinement does not converge in
# reasonable time at that scale. These cells connect only to power /
# ground rails, so dropping them does not affect LVS coverage.
LVS_IGNORE_CELLS:
# 3.3V standard-cell library
- gf180mcu_as_sc_mcu7t3v3__fill_1
- gf180mcu_as_sc_mcu7t3v3__fill_2
- gf180mcu_as_sc_mcu7t3v3__fill_4
- gf180mcu_as_sc_mcu7t3v3__fill_8
- gf180mcu_as_sc_mcu7t3v3__fillcap_4
- gf180mcu_as_sc_mcu7t3v3__fillcap_8
- gf180mcu_as_sc_mcu7t3v3__fillcap_16
- gf180mcu_as_sc_mcu7t3v3__tap_2
# IO library fill cells
- gf180mcu_fd_io__fill1
- gf180mcu_fd_io__fill5
- gf180mcu_fd_io__fill10
- gf180mcu_fd_io__fillnc

# Clock
CLOCK_PORT: clk_PAD
CLOCK_NET: clk_pad/Y
CLOCK_PERIOD: 17

# Fix hold violations
PL_RESIZER_HOLD_SLACK_MARGIN: 0.5
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.5

# (Possibly) fix setup due to buffering large fanouts
RUN_POST_GRT_RESIZER_TIMING: true
GRT_RESIZER_SETUP_SLACK_MARGIN: 0.1

RUN_POST_GRT_DESIGN_REPAIR: true

# Allow for huge fanouts so they are driven by large buffers instead of chains, which helps meeting setup
MAX_FANOUT_CONSTRAINT: 20

# Increase density for more 
# logic on your die
PL_TARGET_DENSITY_PCT: 35
GRT_ALLOW_CONGESTION: true

# Allow a larger Y displacement
PL_MAX_DISPLACEMENT_Y: 200

# Fix antenna violations after DRT
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10 # %

# PDN
PDN_CFG: dir::pdn/pdn_cfg.tcl
PDN_ENABLE_PINS: False

# PDN - Straps
PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75

# PDN - Core ring
PDN_CORE_RING: True
# Maximum metal width without slotting: 30um
PDN_CORE_RING_VWIDTH: 25
PDN_CORE_RING_HWIDTH: 25
PDN_CORE_RING_CONNECT_TO_PADS: True
PDN_CORE_VERTICAL_LAYER: Metal4
PDN_CORE_HORIZONTAL_LAYER: Metal3
PDN_CORE_RING_CONNECT_TO_PAD_LAYERS: [Metal2]

# Do not error on magic DRC violations
# Note: Passing magic DRC is not required for the submission.
# However, it is recommended to fix or carefully review all violations.
ERROR_ON_MAGIC_DRC: False

# Prevent false positive DRC errors in I/O cells
MAGIC_GDS_FLATGLOB:
# For contacts
- "*_CDNS_*"
# 3.3V (based on foundry SRAM layout) + 5V foundry
- "*$$*"
- "M1_N*"
- "M1_P*"
- "M2_M1*"
- "M3_M2*"
- "nmos_5p0*"
- "nmos_1p2*"
- "nmos_3p3*"
- "pmos_5p0*"
- "pmos_1p2*"
- "pmos_3p3*"
- "via1_*"
- "ypass_gate*"
- "G_ring_*"
# These additional cells must be flattened to get rid of 3.3V devices
# (DUALGATE drawn into high-level cells)
- "dcap_103*"
- "din_*"
- "mux821_*"
- "rdummy_*"
- "pmoscap_*"
- "xdec_*"
- "ypredec*"
- "xpredec*"
- "prexdec_*"
- "xdec8_*"
- "xdec16_*"
- "xdec32_*"
- "sa_*"

# Since we cannot meet the minimum density limit on Metal2,
# ignore active metal on previous and subsequent layers
# (DM.5_DM.7 and DM.4_DM.6). Dummy metal is moved to active
# metal during the precheck.
KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true

# Because we have multiple power pads for one power domain
MAGIC_EXT_UNIQUE: notopports

# these warnings are always benign
LINTER_DISABLE_WARNINGS:
- TIMESCALEMOD
- DECLFILENAME

# Image render settings
KLAYOUT_RENDER_RESOLUTION: 2048
KLAYOUT_RENDER_OVERSAMPLING: 3
KLAYOUT_PROPERTIES: dir::gf180mcu_render.lyp

# DRC settings
# A high number of workers increases RAM usage,
# but can significantly improve the performance.
# workers * threads should equal the available
# hardware threads for a best possible utilization.

KLAYOUT_DRC_THREADS: 1

# "max" equals max hardware threads
# Capped at 4: even 8 workers (down from `max` = 32 on this machine) still
# OOM-killed mid-run on this design's densest layers (e.g. via4 ~9.8M polygons,
# workers observed at ~3.5-4.9GB RSS each), exceeding available RAM.
KLAYOUT_DRC_OPTIONS:
  decks: "all,-antenna,-density,-cup" # disable CUP for now
  variant: ref::$PDK
  workers: 4

KLAYOUT_DENSITY_OPTIONS:
  decks: "density"
  variant: ref::$PDK
  workers: max

KLAYOUT_ANTENNA_OPTIONS:
  decks: "antenna"
  variant: ref::$PDK
  workers: max
