# Each [[region]] block is one contiguous write.
# address : start word address (hex or decimal)
# words   : list of 8-byte rows, MSB first (big-endian), values may be hex
 
# ── Scalar pipeline parameters (bias, zp, mul) ───────────────────────────────
[[region]]
address = 0x0300
words = [
  [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00],  # start bias
  [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00],  # 
  [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00],  # 
  [0x00, 0x00, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00],  # end bias
  [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00],  # start zp
  [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00],  # 
  [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00],  #
  [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00],  # end zp
  [0x80, 0x00, 0x00, 0x00, 0x80, 0x00, 0x00, 0x00],  # start scale
  [0x80, 0x00, 0x00, 0x00, 0x80, 0x00, 0x00, 0x00],  # 
  [0x80, 0x00, 0x00, 0x00, 0x80, 0x00, 0x00, 0x00],  #
  [0x80, 0x00, 0x00, 0x00, 0x80, 0x00, 0x00, 0x00],  # end scale
  [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x01],  # start act matrix
  [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x02],  # 
  [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x03],  # 
  [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x04],  # 
  [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x05],  # 
  [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x06],  # 
  [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x07],  #
  [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x08],  #
]
 
# ── Weight matrix (rows pre-flipped as required by the TPU) ──────────────────
[[region]]
address = 0x0100
words = [
  [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x01],
  [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x01, 0x00],
  [0x00, 0x00, 0x00, 0x00, 0x00, 0x01, 0x00, 0x00],
  [0x00, 0x00, 0x00, 0x00, 0x01, 0x00, 0x00, 0x00],
  [0x00, 0x00, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00],
  [0x00, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00],
  [0x00, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00],
  [0x01, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00],
]
 