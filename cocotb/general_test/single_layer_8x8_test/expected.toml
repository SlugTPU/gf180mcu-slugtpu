# expected.toml — Memory regions read back and verified after execution.
#
# Each [[check]] block describes one readback region.
# address    : start word address (hex or decimal)
# word_count : number of 8-byte words to read
# expected   : (optional) list of 8-byte rows to assert against, MSB first.
#              Omit the key entirely to read-and-print without asserting.

# ── Output region — assert all 8 words ───────────────────────────────────────
